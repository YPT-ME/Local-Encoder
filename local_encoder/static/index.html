// ── Language ──────────────────────────────────────────────────────────────
const LANGS = ['en', 'pt', 'es'];
function detectLang() {
  const l = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return LANGS.includes(l) ? l : 'en';
}
let LANG = 'en';
function t(key, params) {
  const dict = window.LE_I18N || {};
  let s = (dict[LANG] && dict[LANG][key]) ?? (dict.en && dict.en[key]) ?? key;
  if (params) s = s.replace(/\{(\w+)\}/g, (_, k) => (params[k] ?? '') + '');
  return s;
}
function errText(err) {
  if (!err) return '';
  const key = 'err.' + err.code;
  if (window.LE_I18N && window.LE_I18N.en && window.LE_I18N.en[key]) return t(key, err.params || {});
  return err.message || t('err.unknown', { detail: '' });
}
function codecName(key, label) {
  const k = 'codec.' + key;
  return window.LE_I18N && window.LE_I18N.en && window.LE_I18N.en[k] ? t(k) : label;
}

// ── Helpers ───────────────────────────────────────────────────────────────
function useLocalStorage(key, initial) {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s !== null ? JSON.parse(s) : initial;
    } catch { return initial; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [val, set];
}

// Every request that changes something carries this header (the server refuses others).
async function api(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Local-Encoder': '1' },
    body: JSON.stringify(body || {}),
  });
  let data = null;
  try { data = await res.json(); } catch {}
  return { ok: res.ok, status: res.status, data };
}

// Choices remembered on this computer (server-side settings.json, so they survive another
// port, another browser or an update). Older versions kept them in localStorage: moved once.
const PREF_DEFAULTS = {
  lang: null, sites: [], active_site: '', add_tab: 'link', format: 'auto', qualities: [],
  use_gpu: true, show_advanced: false, category_by_site: {}, folder: '', recent_folders: [],
  folder_recursive: false, hide_sent: false,
};
function readLocal(key, fallback) {
  try { const v = localStorage.getItem(key); return v === null ? fallback : JSON.parse(v); } catch { return fallback; }
}
function migrateLocalPrefs() {
  const prefs = {};
  const sessions = readLocal('ave_sessions', {});
  let sites = readLocal('ave_sites', []);
  const oldUrl = readLocal('ave_server_url', null);
  if (!sites.length && oldUrl) {
    sites = [{ url: normUrl(oldUrl), username: readLocal('ave_username', ''), sslVerify: readLocal('ave_ssl_verify', true), sessionId: readLocal('ave_session_id', '') }];
  }
  if (sites.length) {
    prefs.sites = sites.map(({ url, username, sslVerify }) => ({ url, username, sslVerify: sslVerify !== false }));
    sites.forEach(s => { if (s.sessionId) sessions[`${s.url}|${s.username}`] = s.sessionId; });
    prefs.active_site = readLocal('ave_active_site', '') || `${sites[0].url}|${sites[0].username}`;
  }
  const map = { ave_lang: 'lang', ave_add_tab: 'add_tab', ave_format: 'format', ave_qualities: 'qualities',
    ave_use_gpu: 'use_gpu', ave_show_advanced: 'show_advanced', ave_cat_by_site: 'category_by_site' };
  Object.entries(map).forEach(([k, pk]) => { const v = readLocal(k, undefined); if (v !== undefined) prefs[pk] = v; });
  try {
    localStorage.setItem('ave_sessions', JSON.stringify(sessions));
    ['ave_password', 'ave_server_url', 'ave_username', 'ave_ssl_verify', 'ave_session_id', 'ave_resolutions', 'ave_tab',
     'ave_sites', 'ave_active_site', ...Object.keys(map)].forEach(k => localStorage.removeItem(k));
  } catch {}
  return prefs;
}

function usePrefs() {
  const [prefs, setPrefs] = useState(null);
  const pending = useRef({});
  const timer = useRef(null);
  const flush = useCallback(keepalive => {
    const body = pending.current;
    pending.current = {};
    if (!Object.keys(body).length) return;
    fetch('/api/settings', {
      method: 'POST', keepalive: !!keepalive,
      headers: { 'Content-Type': 'application/json', 'X-Local-Encoder': '1' },
      body: JSON.stringify(body),
    }).catch(() => {});
  }, []);
  useEffect(() => {
    fetch('/api/settings').then(r => r.json()).then(stored => {
      let next = { ...PREF_DEFAULTS, ...stored };
      if (!stored.saved) {
        const moved = migrateLocalPrefs();
        next = { ...next, ...moved };
        pending.current = { ...moved };
        flush(false);
      }
      setPrefs(next);
    }).catch(() => setPrefs({ ...PREF_DEFAULTS }));
    const onHide = () => flush(true);
    window.addEventListener('pagehide', onHide);
    return () => window.removeEventListener('pagehide', onHide);
  }, [flush]);
  const setPref = useCallback((key, value) => {
    setPrefs(prev => {
      const next = typeof value === 'function' ? value(prev[key]) : value;
      pending.current[key] = next;
      return { ...prev, [key]: next };
    });
    clearTimeout(timer.current);
    timer.current = setTimeout(() => flush(false), 400);
  }, [flush]);
  return [prefs, setPref];
}

function normUrl(u) {
  let url = (u || '').trim();
  if (!url) return '';
  if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
  return url.endsWith('/') ? url : url + '/';
}
const siteKey = s => `${s.url}|${s.username}`;
const hostOf = u => { try { return new URL(u).host; } catch { return u; } };
function jobAccountMatches(job, site) {
  return site.url === job.site_url && site.username === job.username;
}
const resLabel = r => (r >= 2160 ? '4K' : r + 'p');
function fmtDuration(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}
function fmtSize(b) {
  if (!b) return '';
  return b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : (b / 1048576).toFixed(1) + ' MB';
}
const VIDEO_EXT = /\.(mp4|mkv|mov|avi|webm|flv|wmv|m4v|mpg|mpeg|ts|mts|m2ts|3gp|ogv|vob)$/i;
const isVideoFile = f => (f.type || '').startsWith('video/') || VIDEO_EXT.test(f.name);

// Error codes that need a new login, and the ones a new attempt cannot fix.
const RECONNECT_CODES = ['wrong_password', 'login_error', 'session_expired', 'cannot_upload', 'refused'];
const NO_RETRY_CODES = ['audio_only', 'playlist_link', 'live_link', 'invalid_url', 'download_private',
  'download_geo', 'download_unavailable', 'download_unsupported', 'source_missing', 'unreadable_file'];
const BLOCKING_PREVIEW = ['invalid_url', 'playlist_link', 'live_link'];

// Mirror of Job._apply in server.py: one event updates one job.
function applyEvent(j, ev, d) {
  const n = { ...j };
  const { job_id, ...rest } = d;
  if (ev === 'log') n.logs = [...(j.logs || []), `[${new Date().toLocaleTimeString()}] ${d.msg}`].slice(-400);
  else if (ev === 'progress') {
    if (j.pct && d.step in j.pct) {
      n.pct = { ...j.pct, [d.step]: Math.max(0, Math.min(100, d.pct | 0)) };
      n.stage = d.step;
    }
  } else if (ev === 'info') {
    const { title, thumbnail, ...info } = rest;
    if (title) n.title = title;
    if (thumbnail) n.thumbnail = thumbnail;
    n.info = { ...(j.info || {}), ...info };
    if ('has_files' in info) n.has_files = info.has_files;
  } else if (ev === 'notice') {
    if (!(j.notices || []).some(x => x.code === rest.code)) n.notices = [...(j.notices || []), rest];
  } else if (ev === 'status') {
    n.status = d.status;
    if (d.status === 'pending') { n.error = null; n.result = null; }
  } else if (ev === 'done') {
    n.status = 'done'; n.result = rest; n.pct = { download: 100, encode: 100, upload: 100 };
  } else if (ev === 'error' || ev === 'cancelled') {
    n.status = ev; n.error = rest;
  }
  return n;
}

function Input({ label, type = 'text', value, onChange, placeholder, onEnter, autoFocus, className = '' }) {
  return (
    <label className="block">
      {label && <span className="text-xs text-slate-400 mb-1 block">{label}</span>}
      <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
        autoFocus={autoFocus}
        onKeyDown={e => { if (e.key === 'Enter' && onEnter) onEnter(); }}
        className={cls('w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100',
          'focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition', className)} />
    </label>
  );
}

    <label className="block">

        {options.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}

}

function Btn({ children, onClick, disabled, variant = 'primary', size = 'md', title, className = '' }) {
  const base = 'inline-flex items-center justify-center gap-1.5 rounded-lg font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed';
  const sz = { xs: 'px-2 py-1 text-xs', sm: 'px-3 py-1.5 text-xs', md: 'px-4 py-2 text-sm', lg: 'px-6 py-2.5 text-base' }[size];
  const v = {
    primary: 'bg-brand hover:bg-brand-dark text-white',
    success: 'bg-emerald-600 hover:bg-emerald-500 text-white',
    ghost: 'bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200',
    danger: 'bg-slate-800 hover:bg-red-900/60 border border-slate-700 text-red-300',
    link: 'text-slate-400 hover:text-slate-200',
  }[variant];
  return <button type="button" onClick={onClick} disabled={disabled} title={title} className={cls(base, sz, v, className)}>{children}</button>;
}

function Card({ children, className = '' }) {

}

}

function SitePanel({ sites, activeKey, conn, form, setForm, showMore, setShowMore, editing, logoOk, setLogoOk,
                     onConnect, onSelect, onRemove, onNew, onDisconnect, onSwitch, onCancelEdit }) {
  const connected = conn.state === 'ok';
  if (connected && !editing) {
    const s = conn.site || {};
    const res = s.resolutions || [];
    const caps = [
      s.hls && t('site.cap_hls'),
      t('site.cap_mp4'),
      s.mp3 && t('site.cap_mp3'),
      res.length && t('site.cap_upto', { res: resLabel(Math.max(...res)) }),
      s.storage_left_minutes != null && t('site.cap_storage', { min: s.storage_left_minutes }),
    ].filter(Boolean);
    return (
      <div className="space-y-3">
        <div className="flex items-center gap-3">
          {conn.logoUrl && logoOk
            ? <img src={conn.logoUrl} alt="" className="h-9 max-w-[90px] object-contain" onError={() => setLogoOk(false)} />
            : <span className="w-9 h-9 rounded-lg bg-slate-800 flex items-center justify-center"><Ico name="globe" size={16} className="text-brand" /></span>}
          <div className="min-w-0">
            <p className="text-sm font-semibold text-slate-100 truncate">{t('site.connected_as', { name: conn.name })}</p>
            <p className="text-xs text-slate-400 truncate">{s.host}</p>
          </div>
        </div>
        <div className="rounded-lg bg-slate-950/60 border border-slate-800 px-3 py-2">
          <p className="text-[11px] uppercase tracking-wider text-slate-500 mb-1">{t('site.receives')}</p>
          <div className="flex flex-wrap gap-1.5">
            {caps.map(c => <span key={c} className="rounded-full bg-slate-800 px-2 py-0.5 text-xs text-slate-300">{c}</span>)}
          </div>
        </div>
        <div className="flex gap-2">
          <Btn variant="ghost" size="sm" onClick={onSwitch}><Ico name="refresh" size={12} />{t('site.switch')}</Btn>
          <Btn variant="link" size="sm" onClick={onDisconnect}><Ico name="logout" size={12} />{t('site.disconnect')}</Btn>
        </div>
      </div>
    );
  }
  const busy = conn.state === 'connecting';
  return (
    <div className="space-y-3">
      {sites.length > 0 && (
        <div>
          <p className="text-xs text-slate-400 mb-1">{t('site.saved')}</p>
          <div className="space-y-1">
            {sites.map(s => (
              <div key={siteKey(s)} className={cls('flex items-center gap-2 rounded-lg border px-2 py-1.5',
                siteKey(s) === activeKey ? 'border-brand bg-brand/10' : 'border-slate-800 bg-slate-900')}>
                <button type="button" onClick={() => onSelect(s)} className="flex-1 min-w-0 text-left">
                  <span className="block text-sm text-slate-100 truncate">{hostOf(s.url)}</span>
                  <span className="block text-xs text-slate-500 truncate">{s.username}</span>
                </button>
                <button type="button" title={t('site.remove')} onClick={() => onRemove(s)}
                  className="p-1 text-slate-500 hover:text-red-400"><Ico name="trash" size={13} /></button>
              </div>
            ))}
          </div>
          <Btn variant="link" size="xs" className="mt-1" onClick={onNew}><Ico name="plus" size={11} />{t('site.add_new')}</Btn>
        </div>
      )}
      <Input label={t('site.address')} type="url" value={form.url} placeholder={t('site.address_ph')}
        onChange={v => setForm(f => ({ ...f, url: v }))} />
      <div className="grid grid-cols-2 gap-2">
        <Input label={t('site.user')} value={form.user} onChange={v => setForm(f => ({ ...f, user: v }))} />
        <Input label={t('site.password')} type="password" value={form.password} onEnter={onConnect}
          onChange={v => setForm(f => ({ ...f, password: v }))} />
      </div>
      <div>
        <button type="button" onClick={() => setShowMore(!showMore)} className="text-xs text-slate-400 hover:text-slate-200 inline-flex items-center gap-1">
          <Ico name={showMore ? 'chevdown' : 'chevright'} size={12} />{t('site.more')}
        </button>
        {showMore && (
          <div className="mt-2 pl-4">
            <label className="flex items-start gap-2 text-xs text-slate-300 cursor-pointer select-none">
              <input type="checkbox" checked={form.sslVerify} onChange={e => setForm(f => ({ ...f, sslVerify: e.target.checked }))} className="accent-brand mt-0.5" />
              <span>{t('site.verify')}<span className="block text-slate-500">{t('site.verify_hint')}</span></span>
            </label>
          </div>
        )}
      </div>
      {conn.hintUser && conn.state === 'none' && <p className="text-xs text-amber-300">{t('site.password_needed', { user: conn.hintUser })}</p>}
      {conn.state === 'error' && (
        <p className="text-xs text-red-300 flex gap-1.5"><Ico name="alert" size={13} className="mt-0.5" />{errText(conn.error)}</p>
      )}
      <div className="flex gap-2">
        <Btn onClick={onConnect} disabled={busy || !form.url.trim() || !form.user.trim() || !form.password}>
          <Ico name="wifi" size={13} />{busy ? t('site.connecting') : t('site.connect')}
        </Btn>
        {connected && <Btn variant="ghost" onClick={onCancelEdit}>{t('site.cancel')}</Btn>}
      </div>
    </div>
  );
}

// ── Folder: pick a folder on this computer, then the videos to send ────────
function fmtDate(epochOrIso) {
  const d = typeof epochOrIso === 'number' ? new Date(epochOrIso * 1000) : new Date(epochOrIso);
  return isNaN(d) ? '' : d.toLocaleDateString(LANG);
}

function FolderPanel({ prefs, setPref, siteUrl, username, selected, setSelected, refreshKey }) {
  const [browsing, setBrowsing] = useState(!prefs.folder);
  const [browse, setBrowse] = useState(null);
  const [pathInput, setPathInput] = useState(prefs.folder || '');
  const [scan, setScan] = useState({ state: 'idle' });
  const [error, setError] = useState(null);

  async function openFolder(path) {
    setError(null);
    try {
      const r = await api('/api/folders/browse', { path: path || '' });
      if (!r.ok) {
        setError((r.data && r.data.detail) || { code: 'unknown' });
        if (path && !browse) {  // a remembered folder that is gone: start from the home folder
          const home = await api('/api/folders/browse', { path: '' });
          if (home.ok) { setBrowse(home.data); setPathInput(home.data.path); }
        }
        return;
      }
      setBrowse(r.data);
      setPathInput(r.data.path);
    } catch { setError({ code: 'connection' }); }
  }

  async function scanFolder(path, keepSelection) {
    if (!path) return;
    setScan(prev => ({ ...prev, state: 'loading' }));
    setError(null);
    try {
      const r = await api('/api/folders/scan', { path, recursive: !!prefs.folder_recursive, site_url: siteUrl || '', username: username || '' });
      if (!r.ok) { setScan({ state: 'idle' }); setError((r.data && r.data.detail) || { code: 'unknown' }); setBrowsing(true); return; }
      const found = r.data;
      setScan({ state: 'ok', ...found });
      setPref('folder', found.path);
      setPref('recent_folders', prev => [found.path, ...(prev || []).filter(f => f !== found.path)].slice(0, 8));
      setSelected(prev => {
        const available = found.videos.filter(v => !v.queued).map(v => v.path);
        if (keepSelection) return prev.filter(p => available.includes(p));
        return found.videos.filter(v => !v.sent && !v.queued).map(v => v.path);
      });
      setBrowsing(false);
    } catch { setScan({ state: 'idle' }); setError({ code: 'connection' }); }
  }

  // Remembered folder: list it right away; look again when the site or the options change.
  useEffect(() => {
    if (prefs.folder) scanFolder(prefs.folder, refreshKey > 0);
    else openFolder('');
  }, [siteUrl, username, prefs.folder_recursive, refreshKey]); // eslint-disable-line react-hooks/exhaustive-deps
  useEffect(() => { if (browsing && !browse) openFolder(prefs.folder || ''); }, [browsing]); // eslint-disable-line react-hooks/exhaustive-deps

  const videos = scan.state === 'ok' || scan.videos ? (scan.videos || []) : [];
  const shown = prefs.hide_sent ? videos.filter(v => !v.sent) : videos;
  const toggle = path => setSelected(prev => (prev.includes(path) ? prev.filter(p => p !== path) : [...prev, path]));
  const placeName = pl => (pl.key === 'drive' ? pl.name : t('folder.place_' + pl.key));

  return (
    <div className="space-y-2">
      {(prefs.recent_folders || []).length > 0 && (
        <div className="flex flex-wrap items-center gap-1.5">
          <span className="text-xs text-slate-500">{t('folder.recent')}</span>
          {prefs.recent_folders.map(f => (
            <button key={f} type="button" title={f} onClick={() => scanFolder(f)}
              className={cls('max-w-[180px] truncate rounded-full border px-2 py-0.5 text-xs',
                f === scan.path ? 'border-brand text-brand bg-brand/10' : 'border-slate-700 text-slate-400 hover:border-slate-500')}>
              {f.split(/[\\/]/).filter(Boolean).pop() || f}
            </button>
          ))}
        </div>
      )}

      {!browsing && scan.path && (
        <div className="flex items-center gap-2 rounded-lg border border-slate-800 bg-slate-950/60 px-2 py-1.5">
          <Ico name="folder" size={14} className="text-brand" />
          <span className="flex-1 truncate text-xs text-slate-200" title={scan.path}>{scan.path}</span>
          <Btn variant="link" size="xs" title={t('folder.refresh')} onClick={() => scanFolder(scan.path, true)}><Ico name="refresh" size={12} /></Btn>
          <Btn variant="ghost" size="xs" onClick={() => { setBrowsing(true); openFolder(scan.path); }}>{t('folder.change')}</Btn>
        </div>
      )}

      {browsing && (
        <div className="rounded-lg border border-slate-800 bg-slate-950/60 p-2 space-y-2">
          <p className="text-xs font-semibold text-slate-300">{t('folder.choose')}</p>
          {browse && (
            <div className="flex flex-wrap gap-1">
              {browse.places.map(pl => (
                <button key={pl.path} type="button" onClick={() => openFolder(pl.path)} title={pl.path}
                  className="rounded-full border border-slate-700 bg-slate-800 px-2 py-0.5 text-xs text-slate-300 hover:border-slate-500">
                  {placeName(pl)}
                </button>
              ))}
            </div>
          )}
          <div className="flex gap-1.5">
            <Btn variant="ghost" size="xs" title={t('folder.up')} disabled={!browse || !browse.parent} onClick={() => openFolder(browse.parent)}>↑</Btn>
            <input value={pathInput} onChange={e => setPathInput(e.target.value)} placeholder={t('folder.path_ph')}
              onKeyDown={e => { if (e.key === 'Enter') openFolder(pathInput); }}
              className="flex-1 min-w-0 rounded-lg border border-slate-700 bg-slate-900 px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-brand" />
            <Btn variant="ghost" size="xs" onClick={() => openFolder(pathInput)}>{t('folder.go')}</Btn>
          </div>
          {browse && (
            <div className="max-h-44 overflow-y-auto log-scroll rounded border border-slate-800">
              {browse.folders.length === 0 && <p className="px-2 py-1.5 text-xs text-slate-500">{t('folder.no_subfolders')}</p>}
              {browse.folders.map(f => (
                <button key={f.path} type="button" onClick={() => openFolder(f.path)}
                  className="flex w-full items-center gap-2 px-2 py-1 text-left text-xs text-slate-300 hover:bg-slate-800">
                  <Ico name="folder" size={12} className="text-slate-500" /><span className="truncate">{f.name}</span>
                </button>
              ))}
            </div>
          )}
          <div className="flex items-center gap-2">
            <Btn size="sm" disabled={!browse} onClick={() => scanFolder(browse.path)}>
              <Ico name="checkmark" size={12} />{t('folder.use')}
            </Btn>
            {browse && <span className="text-xs text-slate-500">{t('folder.here_count', { n: browse.video_count })}</span>}
            {scan.path && <Btn variant="link" size="xs" className="ml-auto" onClick={() => setBrowsing(false)}>{t('site.cancel')}</Btn>}
          </div>
        </div>
      )}

      {error && <p className="text-xs text-red-300 flex gap-1.5"><Ico name="alert" size={12} className="mt-0.5" />{errText(error)}</p>}

      <div className="flex flex-wrap gap-x-4 gap-y-1">
        <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer select-none">
          <input type="checkbox" checked={!!prefs.folder_recursive} onChange={e => setPref('folder_recursive', e.target.checked)} className="accent-brand" />
          {t('folder.recursive')}
        </label>
        <label className="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer select-none">
          <input type="checkbox" checked={!!prefs.hide_sent} onChange={e => setPref('hide_sent', e.target.checked)} className="accent-brand" />
          {t('folder.hide_sent')}
        </label>
      </div>

      {scan.state === 'loading' && <p className="text-xs text-slate-400 inline-flex items-center gap-1.5"><Ico name="loader" size={12} className="animate-spin" />{t('folder.scanning')}</p>}

      {!browsing && scan.state === 'ok' && (
        videos.length === 0
          ? <p className="text-xs text-slate-400">{t('folder.none')}</p>
          : <div className="space-y-1.5">
              <div className="flex items-center gap-1.5 text-xs">
                <span className="text-slate-400 flex-1">{t('folder.count', { n: videos.length, s: selected.length })}</span>
                <Btn variant="link" size="xs" onClick={() => setSelected(shown.filter(v => !v.queued).map(v => v.path))}>{t('folder.select_all')}</Btn>
                <Btn variant="link" size="xs" onClick={() => setSelected(videos.filter(v => !v.sent && !v.queued).map(v => v.path))}>{t('folder.select_new')}</Btn>
                <Btn variant="link" size="xs" onClick={() => setSelected([])}>{t('folder.select_none')}</Btn>
              </div>
              <div className="max-h-64 overflow-y-auto log-scroll rounded-lg border border-slate-800 divide-y divide-slate-800">
                {shown.map(v => (
                  <label key={v.path} className={cls('flex items-center gap-2 px-2 py-1.5 text-xs cursor-pointer hover:bg-slate-800/60', v.queued && 'opacity-50 cursor-not-allowed')}>
                    <input type="checkbox" disabled={v.queued} checked={selected.includes(v.path)} onChange={() => toggle(v.path)} className="accent-brand" />
                    <span className="flex-1 min-w-0">
                      <span className="block truncate text-slate-200" title={v.rel}>{v.rel}</span>
                      <span className="block text-slate-500">{fmtSize(v.size)} · {fmtDate(v.mtime)}</span>
                    </span>
                    {v.queued && <span className="rounded-full bg-amber-900/40 px-2 py-0.5 text-amber-300">{t('folder.queued')}</span>}
                    {!v.queued && v.sent && <span className="rounded-full bg-emerald-900/40 px-2 py-0.5 text-emerald-300" title={'id ' + v.sent.videos_id}>{t('folder.sent', { date: fmtDate(v.sent.date) })}</span>}
                  </label>
                ))}
              </div>
              {scan.truncated && <p className="text-xs text-amber-300">{t('folder.truncated', { n: videos.length })}</p>}
            </div>
      )}
    </div>
  );
}

// ── Queue item ────────────────────────────────────────────────────────────
function stageText(job) {
  const p = job.pct || {};
  const info = job.info || {};
  switch (job.stage) {
    case 'encode':
      return info.encoder_hardware
        ? t('stage.encode_with', { name: codecName(info.encoder_key, info.encoder), pct: p.encode || 0 })
        : t('stage.encode', { pct: p.encode || 0 });
    case 'upload':
      return t('stage.upload', { pct: p.upload || 0 });
    case 'download':
      return job.kind === 'file' ? t('stage.receive', { pct: p.download || 0 }) : t('stage.download', { pct: p.download || 0 });
    default:
      return t('stage.starting');
  }
}

const STATUS_STYLE = {
  pending:   ['text-slate-400', 'bg-slate-800'],
  running:   ['text-amber-300', 'bg-amber-900/40'],
  done:      ['text-emerald-300', 'bg-emerald-900/40'],
  error:     ['text-red-300', 'bg-red-900/40'],
  cancelled: ['text-slate-300', 'bg-slate-800'],
};

function JobCard({ job, onAction, expanded, onToggle }) {
  const pct = job.pct || { download: 0, encode: 0, upload: 0 };
  const info = job.info || {};
  const [tc, bc] = STATUS_STYLE[job.status] || STATUS_STYLE.pending;
  const err = job.error;
  const code = err && err.code;
  const canRetry = (job.status === 'error' || job.status === 'cancelled') && !NO_RETRY_CODES.includes(code);
  const needsLogin = job.status === 'error' && RECONNECT_CODES.includes(code);
  const hasFiles = job.has_files;
  return (
    <div className="rounded-lg border border-slate-700 bg-slate-800/40 p-3 space-y-2">
      <div className="flex items-start gap-3">
        {job.thumbnail
          ? <img src={job.thumbnail} alt="" className="w-20 h-12 rounded object-cover shrink-0 bg-slate-700" />
          : <span className="w-20 h-12 rounded bg-slate-900 flex items-center justify-center shrink-0"><Ico name="film" size={18} className="text-slate-600" /></span>}
        <div className="flex-1 min-w-0">
          <p className="text-sm font-medium text-slate-100 truncate" title={job.title || job.source}>{job.title || job.source}</p>
          <div className="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-xs text-slate-500 mt-0.5">
            <span className={cls('rounded-full px-2 py-0.5 font-semibold', tc, bc)}>
              {job.status === 'running' && <Ico name="loader" size={10} className="animate-spin mr-1" />}
              {t('status.' + job.status)}
            </span>
            <span className="inline-flex items-center gap-1"><Ico name="globe" size={11} />{job.site}{job.username ? ' · ' + job.username : ''}</span>
            {info.duration_s > 0 && <span className="inline-flex items-center gap-1"><Ico name="timer" size={11} />{fmtDuration(info.duration_s)}</span>}
            {info.file_size_bytes > 0 && <span className="inline-flex items-center gap-1"><Ico name="hdd" size={11} />{fmtSize(info.file_size_bytes)}</span>}
          </div>
        </div>
      </div>

      {job.status === 'running' && <p className="text-xs text-slate-300">{stageText(job)}</p>}
      {job.status === 'pending' && <p className="text-xs text-slate-400">{t('stage.waiting')}</p>}
      {job.status === 'done' && <p className="text-xs text-emerald-300 inline-flex items-center gap-1.5"><Ico name="check" size={12} />{t('stage.done')}</p>}
      {(job.status === 'error' || job.status === 'cancelled') && (
        <div className={cls('text-xs rounded-lg px-3 py-2', job.status === 'error' ? 'bg-red-950/40 text-red-200' : 'bg-slate-900 text-slate-300')}>
          <p className="flex gap-1.5"><Ico name={job.status === 'error' ? 'alert' : 'info'} size={13} className="mt-0.5" />{errText(err)}</p>
          {canRetry && hasFiles && <p className="mt-1 text-slate-400">{t('job.kept')}</p>}
        </div>
      )}

      {job.status === 'running' && (
        <div className="space-y-1.5">
          <StepRow label={t('bar.download')} pct={pct.download} color="bg-brand" />
          <StepRow label={t('bar.encode')} pct={pct.encode} color="bg-amber-500" />
          <StepRow label={t('bar.upload')} pct={pct.upload} color="bg-emerald-500" />
        </div>
      )}

      {(job.notices || []).map(n => (
        <p key={n.code} className="text-xs text-amber-200 bg-amber-950/30 rounded-lg px-3 py-1.5 flex gap-1.5">
          <Ico name="info" size={13} className="mt-0.5" />{t('notice.' + n.code, n.params || {})}
        </p>
      ))}

      <div className="flex flex-wrap gap-1.5 pt-0.5">
        {job.status === 'done' && job.result && <>
          <a href={job.result.url} target="_blank" rel="noopener noreferrer"
             className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white">
            <Ico name="extlink" size={12} />{t('job.open')}</a>
          <a href={job.result.edit_url} target="_blank" rel="noopener noreferrer"
             className="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200">
            <Ico name="edit" size={12} />{t('job.edit')}</a>
          <Btn variant="ghost" size="sm" onClick={() => onAction(job, 'copy')}><Ico name="copy" size={12} />{t('job.copy')}</Btn>
        </>}
        {needsLogin && <Btn size="sm" onClick={() => onAction(job, 'reconnect')}><Ico name="wifi" size={12} />{t('job.reconnect')}</Btn>}
        {canRetry && <Btn size="sm" variant={needsLogin ? 'ghost' : 'primary'} onClick={() => onAction(job, 'retry')}><Ico name="refresh" size={12} />{t('job.retry')}</Btn>}
        {(job.status === 'running' || job.status === 'pending') &&
          <Btn variant="danger" size="sm" onClick={() => onAction(job, 'cancel')}><Ico name="stop" size={12} />{t('job.cancel')}</Btn>}
        {hasFiles && job.status !== 'done' &&
          <Btn variant="ghost" size="sm" onClick={() => onAction(job, 'folder')}><Ico name="folder" size={12} />{t('job.folder')}</Btn>}
        {job.status === 'error' &&
          <Btn variant="ghost" size="sm" onClick={() => onAction(job, 'report')}><Ico name="help" size={12} />{t('job.report')}</Btn>}
        <Btn variant="link" size="sm" onClick={onToggle}>
          <Ico name={expanded ? 'chevdown' : 'chevright'} size={12} />{expanded ? t('job.hide_details') : t('job.details')}
        </Btn>
        {job.status !== 'running' && job.status !== 'pending' &&
          <Btn variant="link" size="sm" className="ml-auto" onClick={() => onAction(job, 'remove')}><Ico name="trash" size={12} />{t('job.remove')}</Btn>}
      </div>

      {expanded && <LogScroll logs={job.logs} />}
    </div>
  );
}

function TransferCard({ tr }) {
  return (
    <div className="rounded-lg border border-slate-700 bg-slate-800/40 p-3 space-y-2">
      <div className="flex items-center gap-3">
        <span className="w-20 h-12 rounded bg-slate-900 flex items-center justify-center shrink-0"><Ico name="upload" size={18} className="text-brand" /></span>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-medium text-slate-100 truncate">{tr.name}</p>

}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [prefs, setPref] = usePrefs();
  if (!prefs) {
    return <div className="h-screen flex items-center justify-center text-slate-500"><Ico name="loader" size={24} className="animate-spin" /></div>;
  }
  return <Main prefs={prefs} setPref={setPref} />;
}

function Main({ prefs, setPref }) {
  const lang = prefs.lang || detectLang();
  const setLang = v => setPref('lang', v);
  LANG = LANGS.includes(lang) ? lang : 'en';
  useEffect(() => { document.documentElement.lang = LANG; }, [lang]);

  // Sites: the address and user name are remembered (never the password); the local session id
  // of each site stays in this browser.
  const [sessions, setSessions] = useLocalStorage('ave_sessions', {});
  const sites = (prefs.sites || []).map(s => ({ ...s, sessionId: sessions[siteKey(s)] || '' }));
  const activeKey = prefs.active_site;
  const setActiveKey = v => setPref('active_site', v);
  const [form, setForm] = useState({ url: '', user: '', password: '', sslVerify: true });
  const [handoff, setHandoff] = useState(() => LocalEncoderHandoff.fromFragment(window.location.hash));
  const [showMore, setShowMore] = useState(false);
  const [conn, setConn] = useState({ state: 'none' });
  const connectionGeneration = useRef(0);
  const [editing, setEditing] = useState(false);
  const [logoOk, setLogoOk] = useState(true);
  const [categories, setCategories] = useState([]);

  // Add form (remembered: tab, format, qualities, graphics card, advanced, category per site)
  const tab = prefs.add_tab || 'link';
  const setTab = v => setPref('add_tab', v);
  const [videoUrl, setVideoUrl] = useState('');
  const [preview, setPreview] = useState({ state: 'idle' });
  const [files, setFiles] = useState([]);
  const [fileError, setFileError] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const submittingRef = useRef(false);
  const [title, setTitle] = useState('');
  const [desc, setDesc] = useState('');
  const catBySite = prefs.category_by_site || {};
  const setCatBySite = v => setPref('category_by_site', v);
  const format = prefs.format || 'auto';
  const setFormat = v => setPref('format', v);
  const qualities = prefs.qualities || [];
  const setQualities = v => setPref('qualities', v);
  const useGpu = prefs.use_gpu !== false;
  const setUseGpu = v => setPref('use_gpu', v);
  const showAdvanced = !!prefs.show_advanced;
  const setShowAdvanced = v => setPref('show_advanced', v);
  const fileInput = useRef(null);
  const [folderSel, setFolderSel] = useState([]);
  const [folderRefresh, setFolderRefresh] = useState(0);

  // Queue
  const [jobs, setJobs] = useState([]);
  const [transfers, setTransfers] = useState([]);
  const [expanded, setExpanded] = useState({});
  const jobsRef = useRef(jobs);
  jobsRef.current = jobs;

  const [versionInfo, setVersionInfo] = useState(null);
  const [system, setSystem] = useState(null);
  const [toast, setToast] = useState(null);
  const [dragging, setDragging] = useState(false);

  const connected = conn.state === 'ok';
  const site = conn.site || {};
  const catId = connected ? String(catBySite[conn.key] ?? '0') : '0';

  function showToast(text, ms = 5000) {
    setToast(text);
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => setToast(null), ms);
  }

  function updateSite(key, patch) {
    if ('sessionId' in patch) setSessions(prev => ({ ...prev, [key]: patch.sessionId }));
  }

  function applyConnection(data, base) {
    const entry = { url: data.site.url, username: data.username || base.username, sslVerify: base.sslVerify };
    const key = siteKey(entry);
    setPref('sites', prev => [entry, ...(prev || []).filter(s => siteKey(s) !== key)]);
    setSessions(prev => ({ ...prev, [key]: data.session_id }));
    setActiveKey(key);
    setLogoOk(true);
    setConn({ state: 'ok', key, username: entry.username, name: data.name, logoUrl: data.logo_url, site: data.site, sessionId: data.session_id });
    const cats = data.categories || [];
    setCategories(cats);
    setCatBySite(prev => (cats.some(c => String(c.id) === String(prev[key])) ? prev : { ...prev, [key]: '0' }));
    setEditing(false);
  }

  async function selectSite(s) {
    const generation = ++connectionGeneration.current;
    setForm({ url: s.url, user: s.username, password: '', sslVerify: s.sslVerify !== false });
    setActiveKey(siteKey(s));
    if (s.sessionId) {
      setConn({ state: 'connecting' });
      try {
        const r = await api('/api/session', { session_id: s.sessionId });
        if (generation !== connectionGeneration.current) return;
        if (r.ok && r.data && r.data.ok) { applyConnection(r.data, { username: s.username, sslVerify: s.sslVerify !== false }); return; }
      } catch {}
      if (generation !== connectionGeneration.current) return;
      updateSite(siteKey(s), { sessionId: '' });
    }
    setConn({ state: 'none', hintUser: s.username });
    setEditing(true);
  }

  async function connect() {
    const generation = ++connectionGeneration.current;
    const url = normUrl(form.url);
    const user = form.user.trim();
    setConn({ state: 'connecting' });
    try {
      const r = await api('/api/test-connection', { server_url: url, username: user, password: form.password, ssl_verify: form.sslVerify });
      if (generation !== connectionGeneration.current) return;
      if (r.data && r.data.ok) {
        applyConnection(r.data, { username: user, sslVerify: form.sslVerify });
        setForm(f => ({ ...f, url, password: '' }));
      } else {
        setConn({ state: 'error', error: (r.data && r.data.error_info) || { code: 'unknown', params: { detail: (r.data && (r.data.error || r.data.detail)) || '' } } });
      }
    } catch { if (generation === connectionGeneration.current) setConn({ state: 'error', error: { code: 'connection' } }); }
  }

  async function disconnect() {
    const generation = ++connectionGeneration.current;
    if (conn.sessionId) { try { await api('/api/logout', { session_id: conn.sessionId }); } catch {} }
    if (generation !== connectionGeneration.current) return;
    if (conn.key) updateSite(conn.key, { sessionId: '' });
    setForm(f => ({ ...f, password: '' }));
    setConn({ state: 'none' });
    setEditing(true);
  }

  async function removeSite(s) {
    if (!confirm(t('site.remove_confirm', { site: hostOf(s.url) }))) return;
    if (s.sessionId) { try { await api('/api/logout', { session_id: s.sessionId }); } catch {} }
    const key = siteKey(s);
    setPref('sites', prev => (prev || []).filter(x => siteKey(x) !== key));
    setSessions(prev => { const next = { ...prev }; delete next[key]; return next; });
    if (key === activeKey) {
      setActiveKey('');
      setConn({ state: 'none' });
      setForm({ url: '', user: '', password: '', sslVerify: true });
      setEditing(true);
    }
  }

  function sessionExpired() {
    if (conn.key) updateSite(conn.key, { sessionId: '' });
    setConn({ state: 'error', error: { code: 'session_expired' } });
    setEditing(true);
  }

  function acceptHandoff() {
    if (!handoff || handoff.invalid) return;
    ++connectionGeneration.current;
    setConn({ state: 'none' });
    setCategories([]);
    setForm({ url: handoff.site, user: '', password: '', sslVerify: true });
    setActiveKey('');
    setEditing(true);
    if (handoff.url) { setTab('link'); setVideoUrl(handoff.url); }
    const matching = sites.filter(s => normUrl(s.url) === normUrl(handoff.site));
    if (matching.length === 1) selectSite(matching[0]);
    setHandoff(null);
  }

  useEffect(() => {
    function readHandoff() {
      const request = LocalEncoderHandoff.fromFragment(window.location.hash);
      if (request) {
        setHandoff(request);
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    }
    readHandoff();
    window.addEventListener('hashchange', readHandoff);
    return () => window.removeEventListener('hashchange', readHandoff);
  }, []);

  // Start: reconnect to the last site and follow the queue.
  useEffect(() => {
    const start = sites.find(s => siteKey(s) === activeKey) || sites[0];
    if (start && !handoff) selectSite(start); else setEditing(true);

    fetch('/api/version').then(r => r.json()).then(setVersionInfo).catch(() => {});

    // One stream for the whole queue: it first sends every job, also after a reconnection.
    const es = new EventSource('/api/events');
    es.addEventListener('jobs', e => setJobs(JSON.parse(e.data).jobs || []));
    es.addEventListener('added', e => {
      const j = JSON.parse(e.data);
      setJobs(prev => (prev.some(x => x.job_id === j.job_id) ? prev : [...prev, j]));
    });
    es.addEventListener('removed', e => {
      const d = JSON.parse(e.data);
      setJobs(prev => prev.filter(j => j.job_id !== d.job_id));
    });
    ['log', 'progress', 'info', 'notice', 'status', 'done', 'error', 'cancelled'].forEach(ev =>
      es.addEventListener(ev, e => {
        if (!e.data) return; // the browser's own connection "error" event has no data
        const d = JSON.parse(e.data);
        setJobs(prev => prev.map(j => (j.job_id === d.job_id ? applyEvent(j, ev, d) : j)));
        if (ev === 'done' || ev === 'error') notifyEnd(ev, d.job_id);
      }));
    return () => es.close();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Graphics card detection runs once in the background.
  useEffect(() => {
    let stop = false;
    async function poll() {
      try {
        const d = await (await fetch('/api/system')).json();
        if (stop) return;
        setSystem(d);
        if (d.gpu && d.gpu.status !== 'done') setTimeout(poll, 2000);
      } catch {}
    }
    poll();
    return () => { stop = true; };
  }, []);

  // Desktop notification when a video ends while the page is hidden.
  function notifyEnd(ev, jobId) {
    if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    const job = jobsRef.current.find(j => j.job_id === jobId);
    try {
      new Notification(ev === 'done' ? t('notify.done_title') : t('notify.error_title'),
        { body: job ? job.title || job.source : '', tag: jobId });
    } catch {}
  }
  function askNotificationPermission() {
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
  }

  // Progress in the browser tab title.
  useEffect(() => {
    const running = jobs.find(j => j.status === 'running');
    if (running) {
      const p = running.pct || {};
      document.title = `(${Math.round(((p.download || 0) + (p.encode || 0) + (p.upload || 0)) / 3)}%) Local Encoder`;
    } else if (transfers.length) {
      document.title = '(…) Local Encoder';
    } else {
      document.title = 'Local Encoder';
    }
  }, [jobs, transfers]);

  // Closing the page while a file is still being copied into Local Encoder would lose it.
  useEffect(() => {
    if (!transfers.length) return;
    const h = e => { e.preventDefault(); e.returnValue = ''; return ''; };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, [transfers.length]);

  // Link preview (title, picture, length) a moment after the user stops typing.
  useEffect(() => {
    const url = videoUrl.trim();
    if (!url) { setPreview({ state: 'idle' }); return; }
    if (!/^https?:\/\/\S+$/i.test(url)) { setPreview({ state: 'error', error: { code: 'invalid_url' } }); return; }
    setPreview({ state: 'loading' });
    let cancelled = false;
    const timer = setTimeout(async () => {
      try {
        const r = await api('/api/preview', { url });
        if (cancelled) return;
        setPreview(r.data && r.data.ok ? { state: 'ok', data: r.data } : { state: 'error', error: (r.data && r.data.error) || { code: 'unknown' } });
      } catch { if (!cancelled) setPreview({ state: 'error', error: { code: 'connection' } }); }
    }, 700);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [videoUrl]);

  // Drag and drop video files anywhere on the page.
  function addFiles(list) {
    const videos = list.filter(isVideoFile);
    if (!videos.length) return;
    setFiles(prev => [...prev, ...videos.filter(v => !prev.some(p => p.name === v.name && p.size === v.size))]);
    setTab('files');
  }
  const addFilesRef = useRef(addFiles);
  addFilesRef.current = addFiles;
  useEffect(() => {
    let depth = 0;
    const isFiles = e => Array.from((e.dataTransfer && e.dataTransfer.types) || []).includes('Files');
    const enter = e => { if (!isFiles(e)) return; e.preventDefault(); depth++; setDragging(true); };
    const over = e => { if (isFiles(e)) e.preventDefault(); };
    const leave = e => { if (!isFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) setDragging(false); };
    const drop = e => {
      if (!isFiles(e)) return;
      e.preventDefault(); depth = 0; setDragging(false);
      addFilesRef.current(Array.from(e.dataTransfer.files || []));
    };
    window.addEventListener('dragenter', enter);
    window.addEventListener('dragover', over);
    window.addEventListener('dragleave', leave);
    window.addEventListener('drop', drop);
    return () => {
      window.removeEventListener('dragenter', enter);
      window.removeEventListener('dragover', over);
      window.removeEventListener('dragleave', leave);
      window.removeEventListener('drop', drop);
    };
  }, []);

  function currentOptions() {
    return {
      session_id: conn.sessionId,
      categories_id: parseInt(catId) || 0,
      description: desc,
      format: site.hls === false && format === 'hls' ? 'auto' : format,
      resolutions: qualities.filter(q => (site.resolutions || []).includes(q)),
      use_gpu: !!useGpu,
    };
  }

  function sendFile(file, fileTitle, opts) {
    return new Promise(resolve => {
      const id = 'tr-' + Math.random().toString(36).slice(2);
      setTransfers(prev => [...prev, { id, name: file.name, pct: 0 }]);
      const fd = new FormData();
      fd.append('file', file);
      fd.append('session_id', opts.session_id);
      fd.append('categories_id', String(opts.categories_id));
      fd.append('title', fileTitle);
      fd.append('description', opts.description);
      fd.append('format', opts.format);
      fd.append('resolution', opts.resolutions.join(','));
      fd.append('use_gpu', opts.use_gpu ? '1' : '0');
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/import-file');
      xhr.setRequestHeader('X-Local-Encoder', '1');
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) setTransfers(prev => prev.map(x => (x.id === id ? { ...x, pct: Math.round(e.loaded * 100 / e.total) } : x)));
      };
      const finish = ok => { setTransfers(prev => prev.filter(x => x.id !== id)); resolve(ok); };
      xhr.onload = () => {
        let data = null;
        try { data = JSON.parse(xhr.responseText); } catch {}
        const ok = xhr.status >= 200 && xhr.status < 300 && !!(data && data.job_id);
        if (xhr.status === 401) {
          sessionExpired();
          setFileError({ code: 'session_expired' });
        } else if (!ok) setFileError({ code: 'file_receive_failed' });
        finish(ok);
      };
      xhr.onerror = () => { setFileError({ code: 'connection' }); finish(false); };
      xhr.send(fd);
    });
  }

  async function submit() {
    if (!connected || submittingRef.current) return;
    submittingRef.current = true;
    setSubmitting(true);
    setFileError(null);
    try {
      askNotificationPermission();
      const opts = currentOptions();
      if (tab === 'folder') {
        try {
          const r = await api('/api/import-local', { ...opts, paths: folderSel });
          if (r.status === 401) { sessionExpired(); return; }
          if (!r.ok) { showToast(errText(r.data && r.data.detail) || t('err.unknown', { detail: r.status })); return; }
          const added = (r.data.job_ids || []).length, skipped = (r.data.skipped || []).length;
          showToast(t('folder.added', { n: added }) + (skipped ? ' ' + t('folder.skipped', { n: skipped }) : ''));
          setFolderSel([]); setDesc('');
          setFolderRefresh(n => n + 1);
        } catch { showToast(t('err.connection')); }
        return;
      }
      if (tab === 'link') {
        try {
          const r = await api('/api/import', { ...opts, url: videoUrl.trim(), title: title.trim() });
          if (r.status === 401) { sessionExpired(); return; }
          if (!r.ok) { showToast((r.data && r.data.detail) || t('err.unknown', { detail: r.status })); return; }
          setVideoUrl(''); setTitle(''); setDesc('');
        } catch { showToast(t('err.connection')); }
      } else {
        const list = [...files];
        const fileTitle = list.length === 1 ? title.trim() : '';
        for (const f of list) {
          if (!await sendFile(f, fileTitle, opts)) return;
          setFiles(prev => prev.filter(file => file !== f));
        }
        setTitle(''); setDesc('');
      }
    } finally {
      submittingRef.current = false;
      setSubmitting(false);
    }
  }

  async function report(jobId) {
    try {
      const r = await api('/api/report', { job_id: jobId || '' });
      if (r.ok && r.data) {
        window.open(r.data.issue_url, '_blank', 'noopener');
        showToast(t('report.done'), 9000);
      } else showToast(t('report.failed'));
    } catch { showToast(t('report.failed')); }
  }

  async function jobAction(job, action) {
    const path = `/api/jobs/${job.job_id}`;
    try {
      if (action === 'cancel') {
        if (job.status === 'running' && !confirm(t('job.cancel_confirm'))) return;
        await api(`${path}/cancel`);
      } else if (action === 'retry') {
        const saved = sites.find(s => jobAccountMatches(job, s) && s.sessionId);
        const sid = connected && jobAccountMatches(job, { url: site.url, username: conn.username }) ? conn.sessionId : (saved ? saved.sessionId : '');
        const r = await api(`${path}/retry`, { session_id: sid });
        if (r.status === 401 || r.status === 400) {
          showToast(t('toast.reconnect', { site: job.site, user: job.username }));
          reconnectJob(job);
        }
      } else if (action === 'remove') {
        if (job.status !== 'done' && job.has_files && !confirm(t('job.remove_confirm'))) return;
        await api(`${path}/remove`, { delete_files: true });
      } else if (action === 'folder') {
        await api(`${path}/open-folder`);
      } else if (action === 'report') {
        await report(job.job_id);
      } else if (action === 'copy') {
        await navigator.clipboard.writeText(job.result.url);
        showToast(t('job.copied'), 2500);
      } else if (action === 'reconnect') {
        reconnectJob(job);
      }
    } catch { showToast(t('err.connection')); }
  }

  function reconnectJob(job) {
    const saved = sites.find(s => jobAccountMatches(job, s));
    setForm({ url: job.site_url, user: job.username, password: '', sslVerify: !saved || saved.sslVerify !== false });
    setActiveKey(`${job.site_url}|${job.username}`);
    setConn({ state: 'none', hintUser: job.username });
    setEditing(true);
  }

  async function clearDone() {
    for (const j of jobs.filter(x => x.status === 'done')) {
      try { await api(`/api/jobs/${j.job_id}/remove`, { delete_files: true }); } catch {}
    }
  }

  const blockedPreview = tab === 'link' && preview.state === 'error' && BLOCKING_PREVIEW.includes(preview.error && preview.error.code);
  const canSubmit = connected && !submitting && (tab === 'link' ? !!videoUrl.trim() && !blockedPreview
    : tab === 'folder' ? folderSel.length > 0 : files.length > 0);
  const submitCount = tab === 'folder' ? folderSel.length : tab === 'files' ? files.length : 1;
  const catOptions = [{ value: '0', label: t('add.category_none') }, ...categories.map(c => ({ value: String(c.id), label: c.name }))];
  const siteRes = site.resolutions || [];
  const gpu = system && system.gpu;
  const doneCount = jobs.filter(j => j.status === 'done').length;

  return (
    <div className="flex flex-col h-screen overflow-hidden">
      {dragging && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 border-4 border-dashed border-brand flex items-center justify-center pointer-events-none">
          <p className="text-xl font-semibold text-slate-100 inline-flex items-center gap-3"><Ico name="upload" size={28} className="text-brand" />{t('add.drop_overlay')}</p>
        </div>
      )}

      {/* ── Top bar ───────────────────────────────────────────── */}
      <header className="shrink-0 flex items-center gap-3 px-5 py-2.5 border-b border-slate-800 bg-slate-950/80 backdrop-blur">
        <span className="inline-flex items-center gap-2 text-base font-bold tracking-tight text-slate-100">
          <span className="w-7 h-7 rounded-lg bg-brand flex items-center justify-center"><svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M6 4l15 8-15 8z"/></svg></span>
          Local <span className="text-brand -ml-1.5">Encoder</span>
        </span>
        <div className="flex-1" />
        {versionInfo && versionInfo.update_available && (
          <a href={versionInfo.download_url} target="_blank" rel="noopener noreferrer"
            className="inline-flex items-center gap-1.5 rounded-full bg-amber-900/60 px-3 py-1 text-xs font-bold text-amber-300 hover:bg-amber-800/60">
            <Ico name="extlink" size={12} />{t('header.update', { v: versionInfo.latest })}
          </a>
        )}
        <label className="inline-flex items-center gap-1.5 text-xs text-slate-400">
          <Ico name="globe" size={13} />
          <select value={LANG} onChange={e => setLang(e.target.value)} aria-label="Language"
            className="bg-transparent text-slate-300 focus:outline-none cursor-pointer">
            {LANGS.map(l => <option key={l} value={l} className="bg-slate-900">{(window.LE_I18N[l] || {})['lang.name'] || l}</option>)}
          </select>
        </label>
        <Btn variant="link" size="sm" onClick={() => report('')}><Ico name="help" size={13} />{t('header.report')}</Btn>
        {versionInfo && <span className="text-xs text-slate-600">v{versionInfo.version}</span>}
      </header>

      <div className="flex flex-1 overflow-hidden">
        {/* LEFT: step 1 + step 2 */}
        <aside className="w-[420px] shrink-0 border-r border-slate-800 overflow-y-auto log-scroll bg-slate-950/40">
          <div className="p-4 space-y-4">
            {handoff && <Card>
              <h2 className="font-semibold text-slate-100">{t('handoff.title')}</h2>
              {handoff.invalid ? <p className="text-sm text-amber-300 mt-2">{t('handoff.invalid')}</p> : <>
                <p className="text-sm text-slate-300 mt-2">{t('handoff.review')}</p>
                <p className="text-sm text-slate-100 break-all mt-2">{handoff.site}</p>
                {handoff.url && <p className="text-xs text-slate-400 break-all mt-2">{handoff.url}</p>}
                <p className="text-xs text-slate-400 mt-2">{t('handoff.confirm')}</p>
                <Btn onClick={acceptHandoff} className="mt-3">{t('handoff.use')}</Btn>
              </>}
              <Btn variant="link" onClick={() => setHandoff(null)}>{t('handoff.dismiss')}</Btn>
            </Card>}
            <Card>
              <StepTitle n={1} title={t('step1.title')} done={connected} />
              <SitePanel sites={sites} activeKey={activeKey} conn={conn} form={form} setForm={setForm}
                showMore={showMore} setShowMore={setShowMore} editing={editing} logoOk={logoOk} setLogoOk={setLogoOk}
                onConnect={connect} onSelect={selectSite} onRemove={removeSite}
                onNew={() => { setForm({ url: '', user: '', password: '', sslVerify: true }); setConn(c => (c.state === 'ok' ? c : { state: 'none' })); }}
                onDisconnect={disconnect} onSwitch={() => setEditing(true)}
                onCancelEdit={() => setEditing(false)} />
            </Card>

            <Card className={cls(!connected && 'opacity-60')}>
              <StepTitle n={2} title={t('step2.title')} />
              {!connected && <p className="text-xs text-amber-300 mb-3 inline-flex items-center gap-1.5"><Ico name="info" size={12} />{t('site.connect_first')}</p>}

              <div className="flex gap-1 mb-3 rounded-lg bg-slate-800/60 p-1 w-fit">
                {[['link', 'link', t('add.tab_link')], ['files', 'upload', t('add.tab_files')], ['folder', 'folder', t('add.tab_folder')]].map(([key, icon, label]) => (
                  <button key={key} type="button" onClick={() => setTab(key)}
                    className={cls('inline-flex items-center gap-1.5 rounded-md px-4 py-1.5 text-xs font-semibold transition',
                      tab === key ? 'bg-brand text-white shadow' : 'text-slate-400 hover:text-slate-200')}>
                    <Ico name={icon} size={11} />{label}
                  </button>
                ))}
              </div>

              <div className="space-y-3">
                {tab === 'link' ? (
                  <div className="space-y-2">
                    <Input label={t('add.link')} type="url" value={videoUrl} onChange={setVideoUrl} placeholder={t('add.link_ph')} onEnter={() => canSubmit && submit()} />
                    {preview.state === 'loading' && <p className="text-xs text-slate-400 inline-flex items-center gap-1.5"><Ico name="loader" size={12} className="animate-spin" />{t('add.checking')}</p>}
                    {preview.state === 'error' && <p className={cls('text-xs flex gap-1.5', blockedPreview ? 'text-red-300' : 'text-amber-300')}><Ico name="alert" size={12} className="mt-0.5" />{errText(preview.error)}</p>}
                    {preview.state === 'ok' && (
                      <div className="flex gap-3 rounded-lg border border-slate-800 bg-slate-950/60 p-2">
                        {preview.data.thumbnail
                          ? <img src={preview.data.thumbnail} alt="" className="w-24 h-14 rounded object-cover shrink-0 bg-slate-800" />
                          : <span className="w-24 h-14 rounded bg-slate-800 flex items-center justify-center shrink-0"><Ico name="film" size={18} className="text-slate-600" /></span>}
                        <div className="min-w-0 text-xs">
                          <p className="text-sm text-slate-100 font-medium line-clamp-2">{preview.data.title}</p>
                          <p className="text-slate-400 truncate">{[preview.data.uploader, preview.data.duration_s ? fmtDuration(preview.data.duration_s) : '', preview.data.source_site].filter(Boolean).join(' · ')}</p>
                        </div>
                      </div>
                    )}
                  </div>
                ) : tab === 'folder' ? (
                  <FolderPanel prefs={prefs} setPref={setPref} siteUrl={connected ? site.url : ''} username={connected ? conn.username : ''}
                    selected={folderSel} setSelected={setFolderSel} refreshKey={folderRefresh} />
                ) : (
                  <div className="space-y-2">
                    <div onClick={() => fileInput.current && fileInput.current.click()}
                      className="flex flex-col items-center justify-center gap-1 rounded-lg border-2 border-dashed border-slate-700 hover:border-brand bg-slate-900 cursor-pointer py-5 text-sm text-slate-400 transition">
                      <Ico name="upload" size={22} className="text-slate-500" />
                      <span>{files.length ? t('add.drop_more') : t('add.drop')}</span>
                    </div>
                    <input ref={fileInput} type="file" multiple className="hidden"
                      accept="video/*,.mkv,.avi,.mov,.flv,.webm,.mp4,.m4v,.wmv,.mpg,.mpeg,.ts,.mts,.m2ts,.3gp,.ogv,.vob"
                      onChange={e => { addFiles(Array.from(e.target.files || [])); e.target.value = ''; }} />
                    {files.map((f, i) => (
                      <div key={f.name + f.size} className="flex items-center gap-2 rounded-lg bg-slate-900 border border-slate-800 px-2 py-1.5 text-xs">
                        <Ico name="film" size={14} className="text-emerald-400" />
                        <span className="flex-1 truncate text-slate-200">{f.name}</span>
                        <span className="text-slate-500">{fmtSize(f.size)}</span>
                        <button type="button" title={t('add.remove_file')} onClick={() => setFiles(prev => prev.filter((_, j) => j !== i))}
                          className="p-0.5 text-slate-500 hover:text-red-400"><Ico name="x" size={12} /></button>
                      </div>
                    ))}
                    {fileError && <p className="text-xs text-red-300 flex gap-1.5"><Ico name="alert" size={12} />{errText(fileError)}</p>}
                  </div>
                )}

                {(tab === 'files' && files.length > 1) || tab === 'folder'
                  ? <p className="text-xs text-slate-400">{t('add.title_multi')}</p>
                  : <Input label={t('add.title')} value={title} onChange={setTitle}
                      placeholder={tab === 'link' && preview.state === 'ok' ? preview.data.title : t('add.title_auto')} />}

                <Select label={t('add.category')} value={catId} options={catOptions}
                  onChange={v => connected && setCatBySite(prev => ({ ...prev, [conn.key]: v }))} />

                <label className="block">
                  <span className="text-xs text-slate-400 mb-1 block">{t('add.description')}</span>
                  <textarea value={desc} onChange={e => setDesc(e.target.value)} placeholder={t('add.description_ph')} rows={2}
                    className="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition resize-none" />
                </label>

                <div>
                  <button type="button" onClick={() => setShowAdvanced(!showAdvanced)} className="text-xs text-slate-400 hover:text-slate-200 inline-flex items-center gap-1">
                    <Ico name={showAdvanced ? 'chevdown' : 'chevright'} size={12} />{t('add.advanced')}
                  </button>
                  {showAdvanced && (
                    <div className="mt-2 space-y-3 rounded-lg border border-slate-800 bg-slate-950/40 p-3">
                      <div>
                        <span className="text-xs text-slate-400 mb-1 block">{t('add.format')}</span>
                        <div className="flex flex-wrap gap-1.5">
                          {[['auto', t('add.format_auto')], ['hls', t('add.format_hls')], ['mp4', t('add.format_mp4')]].map(([v, label]) => {
                            const off = v === 'hls' && connected && site.hls === false;
                            return (
                              <button key={v} type="button" disabled={off} onClick={() => setFormat(v)}
                                className={cls('rounded-full px-3 py-1 text-xs font-semibold border transition disabled:opacity-40 disabled:cursor-not-allowed',
                                  format === v && !off ? 'bg-brand/20 border-brand text-brand' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500')}>
                                {label}
                              </button>
                            );
                          })}
                        </div>
                        {connected && site.hls === false && <p className="text-xs text-slate-500 mt-1">{t('add.format_hls_off')}</p>}
                      </div>
                      <div>
                        <span className="text-xs text-slate-400 mb-1 block">{t('add.quality')}</span>
                        <div className="flex flex-wrap gap-1.5">
                          <button type="button" onClick={() => setQualities([])}
                            className={cls('rounded-full px-2.5 py-0.5 text-xs font-semibold border transition',
                              !qualities.length ? 'bg-brand/20 border-brand text-brand' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500')}>
                            {t('add.title_auto')}
                          </button>
                          {(siteRes.length ? siteRes : [240, 360, 480, 540, 720, 1080, 1440, 2160]).map(r => (
                            <button key={r} type="button"
                              onClick={() => setQualities(qualities.includes(r) ? qualities.filter(x => x !== r) : [...qualities, r].sort((a, b) => a - b))}
                              className={cls('rounded-full px-2.5 py-0.5 text-xs font-semibold border transition',
                                qualities.includes(r) ? 'bg-brand/20 border-brand text-brand' : 'bg-slate-800 border-slate-700 text-slate-400 hover:border-slate-500')}>
                              {resLabel(r)}
                            </button>
                          ))}
                        </div>
                        <p className="text-xs text-slate-500 mt-1">{qualities.length ? t('add.quality_hint') : t('add.quality_auto')}</p>
                      </div>
                      <div>
                        <label className="flex items-start gap-2 text-xs text-slate-300 cursor-pointer select-none">
                          <input type="checkbox" checked={!!useGpu} onChange={e => setUseGpu(e.target.checked)} className="accent-brand mt-0.5" />
                          <span>{t('add.gpu')}
                            <span className="block text-slate-500">
                              {!gpu || gpu.status !== 'done' ? t('add.gpu_detecting')
                                : gpu.hardware ? t('add.gpu_found', { name: codecName(gpu.key, gpu.label) }) : t('add.gpu_none')}
                            </span>
                          </span>
                        </label>
                      </div>
                    </div>
                  )}
                </div>

                <Btn variant="success" size="md" className="w-full" onClick={submit} disabled={!canSubmit}>
                  <Ico name={submitting ? 'loader' : 'plus'} className={submitting ? 'animate-spin' : ''} />{submitting ? t('add.adding') : submitCount > 1 ? t('add.submit_n', { n: submitCount }) : t('add.submit')}
                </Btn>
              </div>
            </Card>
          </div>
        </aside>

        {/* RIGHT: queue */}
        <main className="flex-1 flex flex-col overflow-hidden">
          <div className="shrink-0 px-6 pt-4 pb-3 flex items-center gap-2 border-b border-slate-800">
            <Ico name="list" className="text-brand" size={14} />
            <h2 className="text-sm font-semibold text-slate-300">{t('queue.title')}</h2>
            {jobs.length + transfers.length > 0 && (
              <span className="ml-1 rounded-full bg-slate-800 border border-slate-700 px-2 py-0.5 text-xs text-slate-400">{jobs.length + transfers.length}</span>
            )}
            <div className="flex-1" />
            {doneCount > 0 && <Btn variant="link" size="sm" onClick={clearDone}><Ico name="trash" size={12} />{t('queue.clear_done')}</Btn>}
          </div>

          <div className="flex-1 overflow-y-auto log-scroll px-6 py-4">
            {jobs.length === 0 && transfers.length === 0 ? (
              <div className="flex flex-col items-center justify-center h-full gap-3 text-slate-600 select-none">
                <Ico name="film" size={40} className="opacity-30" />
                <p className="text-sm">{t('queue.empty')}</p>
              </div>
            ) : (
              <div className="space-y-3">
                {jobs.map(job => (
                  <JobCard key={job.job_id} job={job} onAction={jobAction}
                    expanded={!!expanded[job.job_id]}
                    onToggle={() => setExpanded(prev => ({ ...prev, [job.job_id]: !prev[job.job_id] }))} />
                ))}
                {transfers.map(tr => <TransferCard key={tr.id} tr={tr} />)}
              </div>
            )}
          </div>
        </main>
      </div>

      {toast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-40 max-w-lg rounded-lg bg-slate-800 border border-slate-700 px-4 py-2.5 text-sm text-slate-100 shadow-xl">
          {toast}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
