name: Release

# Builds the Local Encoder executables for every platform and publishes them as a GitHub
# Release. Asset names never change, so these links always point to the newest version:
#   https://github.com/YPT-ME/Local-Encoder/releases/latest/download/LocalEncoder-windows-x64.zip
#
# Triggers:
#   - push a tag:        git tag v1.2.3 && git push origin v1.2.3
#   - Actions tab:       "Run workflow"; leave the version empty and the next version is
#                        calculated from the latest release + the chosen increment
#   - yt-dlp-update.yml: automatically when yt-dlp publishes a new version

run-name: >-
  Release ${{ inputs.version && format('v{0}', inputs.version) || (github.ref_type == 'tag' && github.ref_name) || format('(next {0} version)', inputs.bump || 'patch') }}

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Increment used when the version is empty (latest release 1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version (optional, e.g. 1.2.0). Leave empty to calculate it automatically"
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: false
        default: ""
      reason:
        description: "Why this release was made (shown in the release notes)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Decide version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ref: ${{ steps.version.outputs.ref }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          bump="${INPUT_BUMP:-patch}"  # the daily yt-dlp release always uses patch
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            how="from the pushed tag $GITHUB_REF_NAME"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION#v}"
            how="typed in the Run workflow form"
          elif [[ -z "$latest" ]]; then
            # First release: the development version in local_encoder/__init__.py
            version=$(grep '^__version__' local_encoder/__init__.py | cut -d '"' -f 2)
            how="first release, taken from local_encoder/__init__.py"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              *)     version="$major.$minor.$((patch + 1))" ;;
            esac
            how="latest release $latest + $bump"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)"; exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$version already exists. Leave the version empty to use the next one, or type a higher one."; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=${INPUT_REF:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "previous=$latest" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version v$version::$how"
          {
            echo "### Releasing v$version"
            echo
            echo "- How the version was chosen: $how"
            echo "- Latest published release: ${latest:-none}"
            echo "- Commit: ${INPUT_REF:-$GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Tests
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.version.outputs.ref }}

  build:
    name: Build ${{ matrix.platform }}
    needs: [version, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-latest, exe: ".exe" }
          - { platform: macos-arm64, os: macos-15, exe: "" }
          - { platform: macos-x64, os: macos-15-intel, exe: "" }
          - { platform: linux-x64, os: ubuntu-22.04, exe: "" } # older glibc = runs on more distros
          - { platform: linux-arm64, os: ubuntu-22.04-arm, exe: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PYTHONUTF8: "1" # Windows runners default to cp1252 output
      # A small video on GitHub (reliable from Actions): its download must work on every platform.
      SMOKE_DOWNLOAD_URL: https://github.com/mediaelement/mediaelement-files/raw/master/big_buck_bunny.mp4
      # YouTube often blocks datacenter IPs, so this one is only reported (linux-x64).
      SMOKE_YOUTUBE_URL: https://www.youtube.com/watch?v=jNQXAC9IVRw
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp version
        run: python scripts/set_version.py "$VERSION"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/build-constraints.txt -e ".[build]"

      - name: Web UI libraries
        run: python scripts/download_vendor.py

      - name: FFmpeg (static GPL build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_ffmpeg.py "${{ matrix.platform }}"

      - name: deno (JavaScript runtime for YouTube in yt-dlp)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_deno.py "${{ matrix.platform }}"

      - name: Build executable
        run: pyinstaller --noconfirm --clean local-encoder.spec

      - name: Package with licenses
        run: python scripts/make_dist.py "${{ matrix.platform }}"

      # Tests the archive users download (with the FFmpeg, FFprobe and deno it ships), not the
      # bare build: converts a test clip and downloads a video, so a release that cannot encode
      # or download (e.g. after the daily yt-dlp update) is never published.
      - name: Smoke test (the packaged app)
        env:
          SMOKE_DOWNLOAD_URLS: ${{ env.SMOKE_DOWNLOAD_URL }}
          SMOKE_TRY_DOWNLOAD_URLS: ${{ matrix.platform == 'linux-x64' && env.SMOKE_YOUTUBE_URL || '' }}
        run: python scripts/smoke_test.py "${{ matrix.platform }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/LocalEncoder-${{ matrix.platform }}.*
            dist/ffmpeg-build-info-${{ matrix.platform }}.json

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      REF: ${{ needs.version.outputs.ref }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      REASON: ${{ inputs.reason }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
          fetch-depth: 0 # the changelog needs the history and the previous release tag
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: assets

      - name: Attach FFmpeg source code (GPL)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, urllib.request
          assets = pathlib.Path("assets")
          rows = []
          for info_file in sorted(assets.glob("ffmpeg-build-info-*.json")):
              info = json.loads(info_file.read_text())
              url = info["source_url"]
              name = "ffmpeg-source-" + url.rsplit("/", 1)[-1].removeprefix("ffmpeg-")
              target = assets / name
              if not target.exists() and "download.html" not in url:
                  print("Downloading", url)
                  urllib.request.urlretrieve(url, target)
              rows.append(f"| {info['platform']} | `{info['version_line'].split(' Copyright')[0]}` | {info['provider_url']} | `{name}` |")
              info_file.unlink()
          pathlib.Path("ffmpeg-table.md").write_text("\n".join(rows) + "\n")
          PY

      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Commits since the previous release, grouped by Conventional Commit type (feat/fix/other).
      - name: Changelog
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          prev, ref = os.environ["PREVIOUS"], os.environ["REF"]
          out = pathlib.Path("changelog.md")
          known = prev and subprocess.run(
              ["git", "rev-parse", "-q", "--verify", f"refs/tags/{prev}"], capture_output=True
          ).returncode == 0
          if not known:
              print(f"No previous release tag ('{prev}'): no changelog")
              out.write_text("")
              raise SystemExit
          log = subprocess.run(
              ["git", "log", "--no-merges", "--format=%h %s", f"{prev}..{ref}"],
              check=True, capture_output=True, text=True,
          ).stdout.splitlines()
          titles = {"feat": "New features", "fix": "Fixes", "": "Other changes"}
          groups = {title: [] for title in titles.values()}
          for line in log:
              sha, _, subject = line.partition(" ")
              m = re.match(r"(feat|fix)(\([^)]*\))?!?:\s*(.+)", subject, re.IGNORECASE)
              kind, text = (m.group(1).lower(), m.group(3)) if m else ("", subject)
              groups[titles[kind]].append(f"- {text[:1].upper()}{text[1:]} ({sha})")
          lines = ["## What's changed", ""]
          for title, items in groups.items():
              if items:
                  lines += [f"### {title}", "", *items, ""]
          if not log:
              lines += ["No code changes since the previous release.", ""]
          repo, version = os.environ["GITHUB_REPOSITORY"], os.environ["VERSION"]
          lines += [f"**Full changelog:** https://github.com/{repo}/compare/{prev}...v{version}", ""]
          out.write_text("\n".join(lines) + "\n")
          print(out.read_text())
          PY

      - name: Release notes
        run: |
          set -euo pipefail
          ytdlp=$(sed -n 's/^yt-dlp==//p' packaging/build-constraints.txt)
          base="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          {
            echo "## Download"
            echo
            echo "| System | File |"
            echo "| --- | --- |"
            echo "| Windows 10/11 (64-bit) | [LocalEncoder-windows-x64.zip]($base/LocalEncoder-windows-x64.zip) |"
            echo "| macOS Apple Silicon (M1/M2/M3/M4) | [LocalEncoder-macos-arm64.zip]($base/LocalEncoder-macos-arm64.zip) |"
            echo "| macOS Intel | [LocalEncoder-macos-x64.zip]($base/LocalEncoder-macos-x64.zip) |"
            echo "| Linux (x64) | [LocalEncoder-linux-x64.tar.gz]($base/LocalEncoder-linux-x64.tar.gz) |"
            echo "| Linux (ARM64) | [LocalEncoder-linux-arm64.tar.gz]($base/LocalEncoder-linux-arm64.tar.gz) |"
            echo
            echo "Unzip and open **LocalEncoder**. The first time, Windows and macOS warn that the app is not signed yet; see README.txt inside the download."
            echo
            if [[ -n "${REASON:-}" ]]; then echo "**Why this release:** $REASON"; echo; fi
            cat changelog.md
            echo "## Included"
            echo
            echo "- yt-dlp $ytdlp"
            echo
            echo "| Platform | FFmpeg | Build provider | Source code (GPL) |"
            echo "| --- | --- | --- | --- |"
            cat ffmpeg-table.md
            echo
            echo "FFmpeg is GPL software, distributed unmodified. Licenses and notices: THIRD_PARTY_NOTICES.md and the licenses folder inside each download."
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$REF" \
            --title "Local Encoder $VERSION" \
            --notes-file notes.md \
            --latest
